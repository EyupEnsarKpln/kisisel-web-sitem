<!DOCTYPE html>

<body>
    <!-- Page Transition Shutter -->
    <div class="page-shutter active" id="page-shutter"></div>

    <!-- Scroll Progress -->
    <div class="scroll-progress" id="scroll-progress"></div>

    <!-- Particle Background -->
    <canvas id="particles-canvas"></canvas>

    <!-- Background Orbs -->
    <div class="galaxy-spiral"></div>
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>
    <div class="bg-noise"></div>

    <!-- Custom Cursor -->
    <div class="cursor-dot"></div>

    <!-- Navigation -->
    <nav class="glass-nav">
        <a href="index.html" class="nav-logo">EEK</a>
        <ul class="nav-links">

    <main>

        <section id="gallery" class="section active-section">

            </div>
            <div id="gallery-grid" class="masonry-grid">
                <!-- Gallery items injected via JS -->
            </div>
        </section>

    <!-- Modal for Media -->
    <div id="media-modal" class="modal">
        <span class="close-modal">&times;</span>
        <button id="modal-prev" class="modal-nav-btn" style="display:none;">&#10094;</button>
        <div class="modal-content" id="modal-content"></div>
        <button id="modal-next" class="modal-nav-btn" style="display:none;">&#10095;</button>
        <div class="modal-caption" id="modal-caption"></div>
    </div>

    <div id="cyber-context-menu" class="cyber-context-menu">

        <div class="context-item" id="ctx-mail">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
            İletişime Geç

    </div>

    <script src="js/data.js"></script>
    <script src="js/particles.js"></script>
    <script src="js/main.js"></script>

</html>
